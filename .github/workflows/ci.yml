name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -v

      - name: CLI smoke test
        run: |
          python -m comfy_api_graphs --help
          python -m comfy_api_graphs show tests/fixtures/minimal_api_graph.json --mermaid
          python -m comfy_api_graphs validate tests/fixtures/minimal_api_graph.json \
            --object-info tests/fixtures/minimal_object_info.json
